name: Atualizar catálogos CATMAT/CATSERV

# Todo dia 1º, às 03h (Brasília), baixa o catálogo oficial do Compras.gov e, se algo mudou,
# publica na main (o Streamlit Cloud reimplanta sozinho). Também pode ser executado à mão:
# aba Actions > "Atualizar catálogos CATMAT/CATSERV" > Run workflow.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-catalogos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar catálogos do Compras.gov
        run: |
          pip install requests
          python scripts/atualizar_catalogo_catmat.py

      - name: Publicar na main se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Projeto Adesões"
          if git diff --cached --quiet; then
            echo "Catálogos sem mudanças."
          else
            git commit -m "chore: atualiza catálogos CATMAT/CATSERV ($(date +%d/%m/%Y))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
